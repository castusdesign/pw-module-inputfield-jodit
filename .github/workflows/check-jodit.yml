name: Checks

# - jodit/ is committed (ProcessWire modules install without a build step), so
#   make sure it's exactly the build of the jodit version in package-lock.json.
#   A Dependabot bump of jodit fails here until someone runs npm run sync-jodit.
# - Type-check the module's JavaScript against that Jodit's types, so a renamed
#   or removed method or option fails here too.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run check-jodit
      - run: npm run typecheck
