name: End-to-end tests

# Runs the Playwright suite against a throwaway ProcessWire (tests/e2e), so a
# Jodit or ProcessWire update that breaks the editor fails here before merge.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pw_version:
        description: ProcessWire version (git tag) to test against
        required: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      PW_VERSION: ${{ inputs.pw_version || '3.0.259' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:up
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
      - if: always()
        run: npm run test:e2e:down
